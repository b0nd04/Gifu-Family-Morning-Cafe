<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Morning Gifu - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Shippori+Mincho:wght@500;700&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { orange: '#FFB347', gold: '#c5a059', black: '#1a1a1a', cream: '#f9f8f6' } },
                    fontFamily: {
                        serif: ['"Playfair Display"', '"Shippori Mincho"', 'serif'],
                        sans: ['"Helvetica Neue"', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .fade-in {
            animation: fadeIn 1.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(to bottom, #fffcf9, #f9f8f6);
            pointer-events: none;
        }
    </style>
</head>

<body class="bg-brand-cream text-brand-black overflow-x-hidden">
    <canvas id="bgCanvas"></canvas>
    <main class="min-h-screen flex flex-col items-center justify-center px-6 relative">
        <div class="max-w-7xl w-full text-center space-y-8 fade-in">
            <div class="space-y-2">
                <span class="text-xs font-bold tracking-[0.4em] uppercase text-brand-gold">The Art of Morning
                    Service</span>
                <h1 class="text-5xl md:text-8xl font-serif font-bold leading-tight whitespace-nowrap">Family Morning<br>
                    Cafe Gifu</h1>
            </div>
            <div class="w-16 h-[1px] bg-brand-black mx-auto"></div>
            <p class="text-lg md:text-xl font-serif italic text-gray-700 max-w-4xl mx-auto leading-relaxed">
                「大型車でも安心、家族みんなが笑顔になれる。岐阜で見つける、特別な朝のひとときを。」
            </p>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 pt-8 max-w-3xl mx-auto">
                <div class="text-center">
                    <span class="block text-2xl mb-2">🚙</span>
                    <h3 class="font-bold text-sm tracking-widest uppercase mb-1">Large Parking</h3>
                    <p class="text-xs text-gray-500">アルファード級も<br>余裕の駐車スペース</p>
                </div>
                <div class="text-center">
                    <span class="block text-2xl mb-2">👶</span>
                    <h3 class="font-bold text-sm tracking-widest uppercase mb-1">Kids Friendly</h3>
                    <p class="text-xs text-gray-500">座敷やメニューなど<br>子どもへの優しさ</p>
                </div>
                <div class="text-center">
                    <span class="block text-2xl mb-2">☕</span>
                    <h3 class="font-bold text-sm tracking-widest uppercase mb-1">Strictly Selected</h3>
                    <p class="text-xs text-gray-500">地元学生が歩いて選んだ<br>岐阜の銘店たち</p>
                </div>
            </div>
            <div class="pt-12">
                <a href="search.html"
                    class="inline-block bg-brand-black text-white px-12 py-5 text-sm font-bold uppercase tracking-[0.2em] hover:bg-brand-gold transition-colors duration-500 shadow-xl">
                    お店を探しに行く
                </a>
            </div>
        </div>
    </main>
    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        class Steam {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 50;
                this.size = Math.random() * 150 + 50;
                this.speed = Math.random() * 0.5 + 1;
                this.opacity = Math.random() * 0.2;
            }
            update() { this.y -= this.speed; if (this.y < -this.size) this.reset(); }
            draw() {
                ctx.beginPath();
                const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                grad.addColorStop(0, `rgba(255, 179, 71, ${this.opacity})`);
                grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = grad;
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        function init() { resize(); for (let i = 0; i < 40; i++) particles.push(new Steam()); animate(); }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        window.addEventListener('resize', resize);
        window.onload = init;
    </script>
</body>

</html>
